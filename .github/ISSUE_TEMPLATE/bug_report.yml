name: Bug report
description: Report a reproducible bug in flexy-date-picker
labels: ['bug']
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Steps to reproduce, ideally a CodeSandbox/StackBlitz link or minimal code snippet.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: e.g. 1.3.3
    validations:
      required: true
  - type: input
    id: react-version
    attributes:
      label: React version
      placeholder: e.g. 19.0.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: Browser, OS, bundler, etc.
